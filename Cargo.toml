[package]
name = "shidou"
version = "0.1.11"
edition = "2024"
rust-version = "1.89.0"
description = "Shidou (始動) — app bootstrap: tracing init, CLI dispatch, config loading"
homepage = "https://github.com/pleme-io/shidou"
repository = "https://github.com/pleme-io/shidou"
readme = "README.md"
license = "MIT"
categories = ["development-tools"]
keywords = ["bootstrap", "init", "tracing", "config", "cli"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dependencies]
# ★ crates.io ONLY — never a git source. Operator ruling 2026-08-06.
#
# shidou's dependency spelling is NOT private to shidou: it is a SOURCE for
# shikumi in every downstream graph, and cargo unifies sources only within a
# spelling. A consumer's `[patch.crates-io]` does not reach a git dep at all.
# Measured that day, shikumi was being reached FOUR incompatible ways at once
# — mado `rev`, shidou `version+git+rev`, tear `branch=main`, and an older
# shidou by bare `git` — so the same graph carried several shikumis and no two
# crates could exchange a shikumi type. mado's own Cargo.toml already records
# that exact failure for garasu ("expected garasu::GpuContext, found
# GpuContext", 2026-07-31).
#
# A semver range has no such failure mode: cargo unifies compatible versions
# from one registry automatically, so no consumer has to know what any other
# pinned and there is no lockstep bump to forget. The previous git pin dated
# to 2026-06-27, when shikumi main had lost
# `closed_axis_label_string_surface` / `serde_via_display_fromstr` and
# `discovery::Format`'s Display/FromStr; all three are long since back, so the
# workaround outlived its cause by six weeks while still describing itself as
# keeping shidou "on absolute-latest".
shikumi = { version = "0.1" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
